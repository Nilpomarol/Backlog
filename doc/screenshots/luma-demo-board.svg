<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Luma feedback board</title>
  <desc id="description">A representative Backlog board populated with fictional Luma product feedback.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10233d" flood-opacity=".12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .bar { fill: #10233d; }
      .panel { fill: #ffffff; stroke: #e4e9f0; stroke-width: 1; }
      .column { fill: #eef2f7; }
      .card { fill: #ffffff; stroke: #e1e7ef; stroke-width: 1; }
      .heading { fill: #10233d; font: 700 23px Arial, sans-serif; }
      .body { fill: #35465c; font: 500 15px Arial, sans-serif; }
      .small { fill: #64748b; font: 500 13px Arial, sans-serif; }
      .nav { fill: #d7e1ed; font: 600 14px Arial, sans-serif; }
      .tag { font: 700 11px Arial, sans-serif; letter-spacing: .4px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <rect class="bar" width="1200" height="68"/>
  <rect x="30" y="19" width="30" height="30" rx="8" fill="#ff6b47"/>
  <rect x="68" y="19" width="30" height="30" rx="8" fill="#76a5c2"/>
  <text x="118" y="42" class="nav" font-size="18">Backlog</text>
  <text x="1045" y="42" class="nav">My feedback</text>
  <rect x="1103" y="18" width="67" height="32" rx="16" fill="#ff6b47"/>
  <text x="1117" y="39" fill="#ffffff" class="tag">NEW</text>

  <rect class="panel" x="28" y="92" width="1144" height="97" rx="14"/>
  <text x="54" y="125" class="heading">Luma</text>
  <text x="54" y="151" class="small">A fictional daily-planning app used only for public screenshots.</text>
  <rect x="747" y="112" width="204" height="42" rx="10" fill="#f4f6f9" stroke="#dbe2eb"/>
  <text x="768" y="138" class="small">Search feedback</text>
  <rect x="967" y="112" width="175" height="42" rx="10" fill="#ffffff" stroke="#dbe2eb"/>
  <text x="986" y="138" class="body">Filters</text>

  <text x="30" y="220" class="small">12 suggestions</text>
  <text x="1063" y="220" class="small">Updated recently</text>

  <rect class="column" x="28" y="240" width="268" height="442" rx="14"/>
  <rect class="column" x="316" y="240" width="268" height="442" rx="14"/>
  <rect class="column" x="604" y="240" width="268" height="442" rx="14"/>
  <rect class="column" x="892" y="240" width="280" height="442" rx="14"/>

  <text x="50" y="275" class="heading" font-size="18">Backlog</text>
  <text x="338" y="275" class="heading" font-size="18">In progress</text>
  <text x="626" y="275" class="heading" font-size="18">In review</text>
  <text x="914" y="275" class="heading" font-size="18">Done</text>

  <g filter="url(#shadow)">
    <rect class="card" x="44" y="297" width="236" height="126" rx="12"/>
    <text x="61" y="326" class="body">Personalize the daily</text>
    <text x="61" y="346" class="body">briefing</text>
    <rect x="61" y="370" width="58" height="21" rx="10" fill="#fee8e1"/>
    <text x="72" y="385" fill="#d85739" class="tag">HIGH</text>
    <text x="61" y="409" class="small">Ava Chen  ·  2 votes</text>

    <rect class="card" x="44" y="441" width="236" height="126" rx="12"/>
    <text x="61" y="470" class="body">Share a plan with a</text>
    <text x="61" y="490" class="body">single link</text>
    <rect x="61" y="514" width="79" height="21" rx="10" fill="#e8f0f8"/>
    <text x="72" y="529" fill="#3d6f99" class="tag">FEATURE</text>
    <text x="61" y="553" class="small">Benoit Martin  ·  1 vote</text>

    <rect class="card" x="332" y="297" width="236" height="126" rx="12"/>
    <text x="349" y="326" class="body">Reduce dashboard load</text>
    <text x="349" y="346" class="body">time</text>
    <rect x="349" y="370" width="58" height="21" rx="10" fill="#fee8e1"/>
    <text x="360" y="385" fill="#d85739" class="tag">HIGH</text>
    <text x="349" y="409" class="small">Benoit Martin</text>

    <rect class="card" x="332" y="441" width="236" height="126" rx="12"/>
    <text x="349" y="470" class="body">Make reminder time</text>
    <text x="349" y="490" class="body">zones explicit</text>
    <rect x="349" y="514" width="72" height="21" rx="10" fill="#fbe4e3"/>
    <text x="360" y="529" fill="#bb3f47" class="tag">URGENT</text>
    <text x="349" y="553" class="small">Ava Chen  ·  1 vote</text>

    <rect class="card" x="620" y="297" width="236" height="142" rx="12"/>
    <text x="637" y="326" class="body">Send a weekly progress</text>
    <text x="637" y="346" class="body">snapshot</text>
    <rect x="637" y="370" width="79" height="21" rx="10" fill="#e8f0f8"/>
    <text x="648" y="385" fill="#3d6f99" class="tag">FEATURE</text>
    <text x="637" y="409" class="small">Camila Reyes  ·  3 votes</text>
    <text x="637" y="427" class="small">1 / 2 checklist items</text>

    <rect class="card" x="620" y="457" width="236" height="110" rx="12"/>
    <text x="637" y="487" class="body">Improve keyboard</text>
    <text x="637" y="507" class="body">focus states</text>
    <rect x="637" y="529" width="51" height="21" rx="10" fill="#e9f3eb"/>
    <text x="647" y="544" fill="#527b5f" class="tag">TASK</text>

    <rect class="card" x="908" y="297" width="248" height="126" rx="12"/>
    <text x="925" y="326" class="body">Draft the summary</text>
    <text x="925" y="346" class="body">email template</text>
    <rect x="925" y="370" width="51" height="21" rx="10" fill="#e9f3eb"/>
    <text x="935" y="385" fill="#527b5f" class="tag">TASK</text>
    <text x="925" y="409" class="small">Camila Reyes</text>

    <rect class="card" x="908" y="441" width="248" height="126" rx="12"/>
    <text x="925" y="470" class="body">Add API health</text>
    <text x="925" y="490" class="body">monitoring</text>
    <rect x="925" y="514" width="51" height="21" rx="10" fill="#e9f3eb"/>
    <text x="935" y="529" fill="#527b5f" class="tag">TASK</text>
    <text x="925" y="553" class="small">Benoit Martin</text>
  </g>
</svg>
